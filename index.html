<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1e1e1e">
<title>401のブログ</title>
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="assets/style.css?v=17">
</head>
<body>
<header class="site">
  <div class="wrap-wide site-inner">
    <a class="site-title" href="#/"><span class="logo" aria-hidden="true">401</span><span><b>401のブログ</b><small>401 BLOG</small></span></a>
    <span class="site-tools"><a class="write-link" href="#/write" hidden>書く</a><button class="logout" type="button" hidden>閉じる</button></span>
  </div>
  <div class="progress" aria-hidden="true"><i></i></div>
</header>
<main id="app" aria-live="polite"></main>
<a class="fab-top" href="#" aria-label="ページの先頭へ"><b>TOP</b></a>
<footer class="site"><div class="wrap-wide"><span class="num">© 401</span><a href="#/" class="to-top">ページの先頭へ</a></div></footer>
<template id="login">
  <section class="panel board">
    <div class="board-h">ログイン<small>401 BLOG</small></div>
    <div class="panel-b">
      <form class="login" autocomplete="on">
        <p class="login-lead">パスワードを入力してください。</p>
        <input type="text" name="username" value="" autocomplete="username" hidden>
        <label class="field"><span>パスワード</span>
          <input type="password" name="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
        </label>
        <label class="check"><input type="checkbox" name="show"><span>パスワードを表示する</span></label>
        <label class="check"><input type="checkbox" name="remember"><span>この端末で記憶する</span></label>
        <div class="login-actions"><button type="submit">開く</button></div>
        <p class="login-msg" role="alert"></p>
      </form>
    </div>
  </section>
</template>
<script src="assets/markdown-it.min.js?v=17" defer></script>
<script src="katex/katex.min.js?v=17" defer></script>
<script src="assets/jlreq.js?v=17" defer></script>
<script src="assets/app.js?v=17" defer></script>
</body>
</html>
