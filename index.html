<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<title>ブログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=block">
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="assets/style.css?v=8">
</head>
<body>
<header class="site">
  <div class="wrap site-inner">
    <a class="site-title" href="#/">ブログ</a>
    <span class="site-tools"><a class="write-link" href="#/write" hidden>書く</a><button class="logout" type="button" hidden>閉じる</button></span>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<footer class="site"><div class="wrap">© 401</div></footer>
<template id="login">
  <section class="panel"><div class="panel-b">
  <form class="login" autocomplete="on">
    <p class="login-lead">このブログを読むにはパスワードが必要です。</p>
    <input type="text" name="username" value="blog" autocomplete="username" hidden>
    <label class="field"><span>パスワード</span>
      <input type="password" name="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
    </label>
    <label class="check"><input type="checkbox" name="remember"><span>この端末で記憶する</span></label>
    <button type="submit">開く</button>
    <p class="login-msg" role="alert"></p>
  </form>
  </div></section>
</template>
<script src="assets/markdown-it.min.js?v=8" defer></script>
<script src="katex/katex.min.js?v=8" defer></script>
<script src="assets/jlreq.js?v=8" defer></script>
<script src="assets/app.js?v=8" defer></script>
</body>
</html>
