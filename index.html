<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3eddc">
<title>401のブログ</title>
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="assets/style.css?v=20">
</head>
<body>
<header class="site">
  <div class="wrap-wide site-inner">
    <a class="site-title" href="#/">401のブログ</a>
    <span class="site-tools"><a class="write-link" href="#/write" hidden>書く</a><button class="logout" type="button" hidden>閉じる</button></span>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<footer class="site"><div class="wrap-wide">401</div></footer>
<template id="login">
  <section class="panel board">
    <header class="login-head no-jl"><h1 class="login-title">401のブログ</h1></header>
    <div class="panel-b">
      <form class="login" autocomplete="on">
                <input type="text" name="username" value="" autocomplete="username" hidden>
        <label class="field"><span>パスワード</span>
          <input type="password" name="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
        </label>
        <label class="check"><input type="checkbox" name="show"><span>パスワードを表示する</span></label>
        <label class="check"><input type="checkbox" name="remember"><span>この端末で記憶する</span></label>
        <div class="login-actions"><button type="submit">開く</button></div>
        <p class="login-msg" role="alert"></p>
      </form>
    </div>
  </section>
</template>
<script src="assets/markdown-it.min.js?v=20" defer></script>
<script src="katex/katex.min.js?v=20" defer></script>
<script src="assets/jlreq.js?v=20" defer></script>
<script src="assets/app.js?v=20" defer></script>
</body>
</html>
